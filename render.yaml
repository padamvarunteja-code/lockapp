# OnlyUs on Render — infrastructure as code.
#
# Persistence here is FREE: data lives in Supabase Postgres (DATABASE_URL),
# so no paid disk is needed and restarts stop wiping accounts.
#
# Option 1 (recommended): one-click deploy
#   Render Dashboard > New > Blueprint > connect this repo.
#   Render will prompt you for ADMIN_BOOTSTRAP_PASSWORD,
#   AUDIT_CHAIN_SECRET and DATABASE_URL, then create the service.
#
# Option 2: existing dashboard service
#   Keep your current service, but add this manually:
#     1. Environment > add DATABASE_URL = your Supabase connection string
#   ...then redeploy. Without DATABASE_URL the app is file-only and all
#   accounts and password changes are wiped on every restart
#   (ephemeral filesystem).

services:
  - type: web
    name: onlyus
    runtime: node
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_BOOTSTRAP_USER
        value: onlyus_admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false # you will be prompted; this becomes the admin password
      - key: AUDIT_CHAIN_SECRET
        sync: false # you will be prompted; min 16 random characters
      - key: DATABASE_URL
        sync: false # Supabase Postgres connection string (pooler URL works)
